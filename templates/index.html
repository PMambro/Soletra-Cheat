<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spelling Bee Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<h1>Spelling Bee</h1>
<p>Enter 7 letters and a required letter:</p>

<input type="text" id="letters" placeholder="7 letters (e.g., apolxie)" maxlength="7" />
<input type="text" id="required" placeholder="Required letter (e.g., p)" maxlength="1" />
<button onclick="getWords()">Generate Words</button>

<div id="result" class="result"></div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
